services:
  api:
    build: ./backend
    container_name: vcp-api
    env_file: .env
    environment:
      - DB_PATH=/app/data/bars.db
    volumes:
      - vcp-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: vcp-web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  vcp-data: